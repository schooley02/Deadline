<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline - Productivity Tower Defense</title>
    <meta name="description" content="Transform your tasks into a tower defense game. Defeat zombie enemies to complete tasks and protect your base!">
    <!-- PWA installable shell (2026-07-20, MOBILE_PWA_PLAN.md sub-session 3) —
         manifest + theme-color + icons. See sw.js's header for cache scope
         (app shell only, no game-state caching — that's localStorage's job). -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A5F55">
    <link rel="icon" href="Assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="Assets/icons/icon-192.png">
    <!-- style.css split by component 2026-07-18 (Milestone 2) — order matters:
         responsive.css MUST load last, it overrides base rules from every
         file above it at equal specificity (see css/responsive.css header
         + docs/DECISIONS.md). -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/gameCanvas.css">
    <link rel="stylesheet" href="css/enemySprites.css">
    <link rel="stylesheet" href="css/enemyStatus.css">
    <link rel="stylesheet" href="css/agendaList.css">
    <link rel="stylesheet" href="css/startedMarker.css">
    <link rel="stylesheet" href="css/fabMenu.css">
    <link rel="stylesheet" href="css/managementWindows.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/routineViews.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/popups.css">
    <link rel="stylesheet" href="css/checkIn.css">
    <link rel="stylesheet" href="css/frozenNotice.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="stylesheet" href="css/stats.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/gameOverReview.css">
    <link rel="stylesheet" href="css/heroes.css">
    <link rel="stylesheet" href="css/heroSpotlight.css">
    <link rel="stylesheet" href="css/heroTray.css">
    <link rel="stylesheet" href="css/goalsPane.css">
    <link rel="stylesheet" href="css/levelPanel.css">
    <link rel="stylesheet" href="css/basePanel.css">
    <link rel="stylesheet" href="css/timeSlider.css">
    <link rel="stylesheet" href="css/dayPager.css">
    <link rel="stylesheet" href="css/enemyAnim.css">
    <link rel="stylesheet" href="css/graveyard.css">
    <link rel="stylesheet" href="css/village.css">
    <link rel="stylesheet" href="css/villageCard.css">
    <link rel="stylesheet" href="css/villagePanel.css">
    <link rel="stylesheet" href="css/howItWorks.css">
    <link rel="stylesheet" href="css/prioritySlots.css">
    <link rel="stylesheet" href="css/climate.css">
    <link rel="stylesheet" href="css/weatherPanel.css">
    <link rel="stylesheet" href="css/devPanel.css">
    <link rel="stylesheet" href="css/glanceStrip.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <!-- Top 60% - Game Canvas Section -->
        <div class="game-canvas">
            <!-- Player Stats Dashboard - Always visible -->
            <div class="stats-overlay">
                <div class="resource-panel">
                    <button type="button" id="baseHealthButton" class="stat-item base-health-button" aria-label="Base health 100 of 100, full strength. Open base health panel">
                        <svg id="baseHealthRing" class="bh-ring bh-ring--full" viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><circle class="bh-ring-track" cx="10" cy="10" r="8" fill="none" stroke-width="3"/><circle id="baseHealthArc" class="bh-ring-arc" cx="10" cy="10" r="8" fill="none" stroke-width="3" stroke-linecap="round" transform="rotate(-90 10 10)" stroke-dasharray="50.27 50.27"/><path class="bh-shield" d="M10 6.2l3 1.2v2.5c0 1.9-1.3 3.1-3 3.8-1.7-.7-3-1.9-3-3.8V7.4z"/></svg>
                        <span id="baseHealthDisplay">100</span>
                        <span id="baseHealthChip" class="bh-chip">Full</span>
                    </button>
                    <button type="button" id="levelButton" class="stat-item level-button" aria-label="Level 1. Open level panel">
                        <svg class="hud-icon" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9l6-5 6 5M4 16l6-5 6 5"/></svg>
                        <span id="playerLevelDisplay">1</span>
                        <span class="level-xp-bar" aria-hidden="true"><span id="playerXpBar" class="level-xp-fill"></span></span>
                    </button>
                    <button type="button" id="villageButton" class="stat-item village-button" aria-label="Village. Open village panel">
                        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M3 18V11l3.5-3L10 11v7"/><path d="M10 18V5l3-3 3 3v13"/><circle cx="13" cy="7.5" r="1.4"/><path d="M2 18h16"/></svg>
                    </button>
                    <button type="button" id="heroesButton" class="stat-item village-button hero-button" aria-label="Heroes. Open heroes window" aria-expanded="false" aria-controls="heroTray"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="7" cy="6.5" r="2.4"/><path d="M2.5 17c0-3 2-5 4.5-5s4.5 2 4.5 5"/><circle cx="14" cy="7.5" r="2"/><path d="M13 12.3c2.6-.2 4.5 1.6 4.5 4.7"/></svg></button>
                    <button type="button" id="playerPointsStat" class="stat-item points-button" aria-label="0 points. Open shop">
                        <svg class="hud-icon" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M10 2v16M14.2 5.8C13.6 4.6 12 4 10 4 7.6 4 6 5.1 6 6.8c0 4.2 8 2.2 8 6.4 0 1.7-1.6 2.8-4 2.8-2 0-3.700-.7-4.400-2"/></svg>
                        <span id="playerPointsDisplay">0</span>
                        <span id="playerPointsNudge" class="points-nudge hidden"></span>
                    </button>
                    <button type="button" id="goalsButton" class="stat-item village-button goals-button" aria-label="Goals. Open goals window" aria-expanded="false" aria-controls="goalsPane"></button>
                </div>
                
            </div>
            
            <!-- Game Canvas with Church Base -->
            <div id="gameCanvas">
                <!-- Graveyard atmosphere (V1, 2026-07-21 — docs/VISUAL_DESIGN_PLAN.md).
                     Decorative only (aria-hidden): sky/clouds/silhouettes/ground
                     layers, all negative z-index so they sit behind #base/
                     #heroBaseZone/#midnightLine/.enemy without touching those
                     elements' own stacking. Slider-coupled parallax is applied via
                     the --scene-progress custom property (js/ui/timeSliderView.js
                     sets it on #gameCanvas); ground is deliberately NOT translated
                     (fixed, per the 2026-07-21 art-direction decision). -->
                <div id="graveyardScene" class="graveyard-scene" aria-hidden="true">
                    <div class="scene-layer scene-sky"></div>
                    <!-- Twinkling pixel stars (2026-11-01, Jeremy): 10 small 2px dots + 4 larger "+" stars in the
                         top of the sky, each on its own stepped blink (css/gameCanvas.css). Decorative. -->
                    <div class="scene-layer scene-stars">
                        <span class="scene-star scene-star--s scene-star--a" style="left:6%;top:10%;--star-dur:3.4s;--star-delay:-0.6s"></span>
                        <span class="scene-star scene-star--s scene-star--b" style="left:14%;top:26%;--star-dur:4.6s;--star-delay:-2.1s"></span>
                        <span class="scene-star scene-star--s scene-star--b" style="left:23%;top:8%;--star-dur:3.0s;--star-delay:-1.4s"></span>
                        <span class="scene-star scene-star--s scene-star--a" style="left:31%;top:31%;--star-dur:5.2s;--star-delay:-3.3s"></span>
                        <span class="scene-star scene-star--s scene-star--a" style="left:40%;top:15%;--star-dur:3.8s;--star-delay:-0.2s"></span>
                        <span class="scene-star scene-star--s scene-star--b" style="left:49%;top:6%;--star-dur:4.2s;--star-delay:-2.8s"></span>
                        <span class="scene-star scene-star--s scene-star--b" style="left:57%;top:28%;--star-dur:2.8s;--star-delay:-1.9s"></span>
                        <span class="scene-star scene-star--s scene-star--a" style="left:66%;top:12%;--star-dur:5.6s;--star-delay:-4.4s"></span>
                        <span class="scene-star scene-star--s scene-star--b" style="left:74%;top:24%;--star-dur:3.5s;--star-delay:-0.9s"></span>
                        <span class="scene-star scene-star--s scene-star--a" style="left:79%;top:6%;--star-dur:4.8s;--star-delay:-3.6s"></span>
                        <span class="scene-star scene-star--l scene-star--a" style="left:10%;top:18%;--star-dur:4.4s;--star-delay:-1.2s"></span>
                        <span class="scene-star scene-star--l scene-star--b" style="left:36%;top:23%;--star-dur:5.8s;--star-delay:-3.9s"></span>
                        <span class="scene-star scene-star--l scene-star--a" style="left:61%;top:9%;--star-dur:3.9s;--star-delay:-2.4s"></span>
                        <span class="scene-star scene-star--l scene-star--b" style="left:69%;top:33%;--star-dur:5.0s;--star-delay:-0.5s"></span>
                    </div>
                    <div class="scene-layer scene-clouds">
                        <div class="scene-clouds-drift"></div>
                    </div>
                    <!-- Run climate (2026-11-03, css/climate.css): extra sky-cloud layers, hidden until a weather band
                         (a climate-* class on #gameCanvas, set by js/ui/climateView.js) switches some on. Each one carries
                         .scene-clouds-drift so the time slider scrubs it like the base layer. Decorative. -->
                    <div class="scene-layer scene-clouds scene-clouds-extra scene-clouds-x1"><div class="scene-clouds-drift"></div></div>
                    <div class="scene-layer scene-clouds scene-clouds-extra scene-clouds-x2"><div class="scene-clouds-drift"></div></div>
                    <div class="scene-layer scene-clouds scene-clouds-extra scene-clouds-x3"><div class="scene-clouds-drift"></div></div>
                    <div class="scene-layer scene-clouds scene-clouds-extra scene-clouds-x4"><div class="scene-clouds-drift"></div></div>
                    <div class="scene-layer scene-clouds scene-clouds-extra scene-clouds-x5"><div class="scene-clouds-drift"></div></div>
                    <div class="scene-layer scene-silhouettes">
                        <svg class="scene-svg" viewBox="0 0 800 160" preserveAspectRatio="none" focusable="false">
                            <path class="scene-hill" d="M0,160 L0,112 Q90,86 190,108 Q300,78 410,104 Q540,66 650,100 Q730,84 800,102 L800,160 Z"/>
                        </svg>
                    </div>
                    <!-- Run climate far haze: a veil over the sky, clouds and hills (z -2, later in the DOM than both), under the ground. -->
                    <div class="scene-layer climate-haze-far"></div>
                    <!-- Storm only (css/climate.css): far rain over the sky + hills, and a soft sheet-lightning glow in the cloud
                         ceiling (one slow fade every ~14s, never a strobe; hidden under fx-reduced / fx-off / reduced motion). -->
                    <div class="scene-layer rain rain--far"></div>
                    <div class="scene-layer climate-lightning"></div>
                    <div class="scene-layer scene-ground"></div>
                </div>
                <!-- Run climate trend UP (css/climate.css): a soft break of light around the moon (above the sky clouds, z -2 and later
                     in the DOM than the scene) -- the moonbeam that falls on the church is .climate-beam below. Decorative. -->
                <div class="climate-break" aria-hidden="true"></div>
                <!-- Achievement village (V7 W2 first slice, 2026-10-29; docs/ART_STYLE.md "Achievement village art"):
                     the Clock tower on the horizon hill, behind the zombie lanes and UNDER #midnightLine
                     (css/village.css z-index 1). Decorative, filled by js/ui/villageView.js. Landscape/desktop
                     only (hidden in the portrait glance strip by css/glanceStrip.css). -->
                <div id="villageLayer" class="village-layer" aria-hidden="true"></div>
                <!-- Nights Survived (2026-10-26): the moon + run night count, top-right.
                     Lives OUTSIDE the aria-hidden scene so screen readers get the count
                     (aria-label set by js/ui/nightsSurvivedView.js). -->
                <div id="nightsSurvived" class="nights-survived" role="img" aria-label="0 nights survived">
                    <div class="nights-moon" aria-hidden="true"></div>
                </div>
                <!-- The count + label (2026-11-03, run climate): on their own layer ABOVE the weather (z 89) so no cloud, haze
                     or rain ever hides the number; same box as the moon above, so it still sits on the disc. Ids unchanged:
                     js/ui/nightsSurvivedView.js still finds #nightsSurvivedCount. -->
                <div id="nightsSurvivedUi" class="nights-ui" aria-hidden="true">
                    <div class="nights-ui-box"><span id="nightsSurvivedCount" class="nights-count nights-count--d2">0</span></div>
                    <div class="nights-label">Nights Survived</div>
                </div>
                <!-- Run graves (V7 W0, 2026-10-28; docs/WORLD_FEEDBACK_PLAN.md): past-run markers on the
                     ZOMBIE lanes, newest next to the hill. This wrapper has NO z-index (no stacking
                     context) so each button's own z-index slots just under its lane's zombies
                     (js/ui/graveyardView.js). Landscape/desktop only. -->
                <div id="runGraves" class="run-graves"></div>
                <!-- Graveyard zone (V7 W0): the right-hand hill. Fixed width (CONFIG.GRAVEYARD_HILL_WIDTH_PX);
                     the zombie field ends at its left edge. Hill, tree and each headstone are separate
                     graphics (placeholder CSS/SVG until the PixelLab art lands, W2). Hidden in the
                     portrait glance strip (css/glanceStrip.css). -->
                <div id="graveyardZone" class="graveyard-zone">
                    <div class="graveyard-hill" aria-hidden="true"></div>
                    <div class="graveyard-tree-clip" aria-hidden="true">
                        <svg class="graveyard-tree" viewBox="0 0 90 110" width="90" height="110" focusable="false">
                            <rect x="52" y="44" width="9" height="66" fill="#0f0e28"/>
                            <path d="M56,48 L30,30 L48,36 L10,22 L46,30 L40,8 L54,34 L66,12 L62,40 L84,30 L60,54 Z" fill="#0f0e28"/>
                        </svg>
                    </div>
                    <div id="graveyardStones" class="graveyard-stones"></div>
                </div>
                <div id="base"></div>
                <!-- Hero spotlight (docs/HERO_SPOTLIGHT_PLAN.md, 2026-10-21): scrim + hero on
                     the layer in front of the church, below the enemies (css/heroSpotlight.css). -->
                <div id="baseScrim"></div>
                <div id="heroSpotlight" class="hero-spotlight"></div>
                <div id="midnightLine" style="display: none;"></div>
                <!-- Run climate near haze (2026-11-03, css/climate.css): a very light film over everything up to the zombies
                     (z 88, under the Nights Survived number at 89). pointer-events none: every tap passes through. Decorative. -->
                <div id="climateNear" class="climate-near" aria-hidden="true"></div>
                <!-- Run climate extras (Build 2, 2026-11-03; css/climate.css), all decorative with pointer-events none:
                     the moonbeam (trend up) lands on the church (z 0, after #base in the DOM => over it, under the village + zombies);
                     fireflies (Clear only) float in the upper zombie lane BEHIND the zombies (z 28); and the NEAR weather wrapper
                     (z 87, clipped to the canvas) holds Fog's front banks and Storm's two near rain layers. The village's own row /
                     mid fog + rain are built inside #villageLayer by js/ui/villageView.js. -->
                <!-- Weather badge (run climate Build 2, js/ui/weatherPanel.js): the pixel icon of the sky, beside the moon; tap = the
                     Weather panel. Hidden until a result exists and in the portrait strip (Stats shows the same readout there). -->
                <button type="button" id="weatherBadge" class="weather-badge" aria-label="Weather" hidden>
                    <span class="weather-badge-chip"><span class="weather-badge-icon"></span><span class="weather-badge-trend"></span></span>
                </button>
                <div class="climate-beam" aria-hidden="true"></div>
                <div class="climate-fireflies" aria-hidden="true">
                    <span class="firefly" style="left:30%;--ff-top:-26px;--ff-d:9s;--ff-t:-1s;--ff-x:16px;--ff-y:-9px"></span>
                    <span class="firefly" style="left:44%;--ff-top:-44px;--ff-d:11s;--ff-t:-5s;--ff-x:-14px;--ff-y:-6px"></span>
                    <span class="firefly" style="left:57%;--ff-top:-12px;--ff-d:8s;--ff-t:-3s;--ff-x:12px;--ff-y:-11px"></span>
                    <span class="firefly" style="left:69%;--ff-top:-36px;--ff-d:10s;--ff-t:-7s;--ff-x:-18px;--ff-y:-7px"></span>
                    <span class="firefly" style="left:38%;--ff-top:4px;--ff-d:12s;--ff-t:-9s;--ff-x:15px;--ff-y:-8px"></span>
                    <span class="firefly" style="left:76%;--ff-top:-18px;--ff-d:7s;--ff-t:-2s;--ff-x:-12px;--ff-y:-10px"></span>
                </div>
                <div id="climateWxNear" class="climate-wx-near" aria-hidden="true">
                    <div class="fog-bank fog-bank--n1"></div>
                    <div class="fog-bank fog-bank--n2"></div>
                    <div class="fog-bank fog-bank--n3"></div>
                    <div class="rain rain--near1"></div>
                    <div class="rain rain--near2"></div>
                </div>
            </div>
            
            <!-- Level Up and Game Over Messages -->
            <div id="levelUpMessage" class="hidden message-overlay">LEVEL UP!</div>
            <div id="gameOverMessage" class="hidden message-overlay">GAME OVER!</div>
        </div>

        <!-- Week Strip (Week scope sub-session 4, phase 2, 2026-07-20 — see
             docs/TIME_SLIDER_WEEK_PLAN.md). 7-day "shape of my week" overview
             above the pager; tap a cell to jump the pager there. Built
             entirely in JS (js/ui/dayPagerView.js's renderWeekStrip). -->
        <div id="weekStripRow" class="week-strip-row"></div>

        <!-- Day Pager + Time Slider share ONE row (2026-10-13, Jeremy: free up
             vertical space in every view). The pager (‹ label ›, Week scope
             sub-session 2, 2026-07-20 — docs/TIME_SLIDER_WEEK_PLAN.md; offset
             -1..+6; yesterday's the static snapshot, sub-session 3;
             js/ui/dayPagerView.js) now sits to the LEFT of the time label and
             slider. The slider (Milestone 4, 2026-07-20) still sits ON the
             canvas/list seam per docs/UI_UX.md. Today scope only; drag/scrub
             previews enemy positions at that time (js/ui/timeSliderView.js);
             the handle stays where it is released; the Now button returns it. -->
        <div class="time-slider-seam">
            <div class="day-pager-group">
                <button id="dayPagerPrev" class="day-pager-btn" aria-label="Previous day">‹</button>
                <!-- role=status + aria-live so pressing the ‹ › buttons announces the
                     newly-viewed day to screen readers (MOBILE_PWA_PLAN.md sub-session 2) —
                     the label text is swapped silently by dayPagerView.js otherwise. -->
                <span id="dayPagerLabel" class="day-pager-label" role="status" aria-live="polite" aria-atomic="true">Today</span>
                <button id="dayPagerNext" class="day-pager-btn" aria-label="Next day">›</button>
            </div>
            <div id="timeSliderLabel" class="time-slider-label">12:00 AM</div>
            <input type="range" id="timeSlider" class="time-slider" aria-label="Preview time of day">
            <!-- Now (2026-11-04): the handle stays where it is released; this returns it to the current time (and to
                 Today when another day is on screen). Hidden while the slider is already live (js/ui/timeSliderView.js). -->
            <button type="button" id="timeSliderNow" class="time-slider-now" hidden aria-label="Back to the current time" title="Back to the current time"><svg class="time-slider-now-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M3.2 6.2 A5.2 5.2 0 1 1 3 9.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M1.6 3.4 L3.3 6.6 L6.5 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.4 5.2 V8.4 L10.6 9.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="time-slider-now-text">Now</span></button>
        </div>

        <!-- Bottom 40% - Task List Section -->
        <div class="task-section">
            <div class="task-header">
                <h2 id="taskSectionTitle">Today's Deadlines</h2>
                <div id="prioritySlots" class="hidden"></div>
                <div class="task-count">
                    <span id="taskCountDisplay">0 tasks</span>
                </div>
            </div>
            
            <!-- Scrollable Task List -->
            <div class="task-list-container">
                <ul id="activeItemsList" class="task-list">
                    <!-- Tasks will be populated by JavaScript -->
                </ul>
                
                <!-- Completed Tasks Section -->
                <div id="completedTasksSection" class="completed-tasks-section hidden ">
                    <h3>Completed Today</h3>
                    <ul id="completedItemsList" class="completed-tasks-list">
                        <!-- Completed tasks will be populated by JavaScript -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- Floating Action Button -->
        <div class="fab-container">
            <button id="fabButton" class="fab" title="Add new item">
                <span class="fab-icon">+</span>
            </button>
            
            <!-- Quick Action Menu -->
            <div id="fabMenu" class="fab-menu hidden">
                <button class="fab-menu-item" data-type="tasks">
                    <span class="fab-menu-icon">📋</span>
                    <span class="fab-menu-label">Tasks</span>
                </button>
                <button class="fab-menu-item" data-type="habits">
                    <span class="fab-menu-icon">⚡</span>
                    <span class="fab-menu-label">Habits</span>
                </button>
                <button class="fab-menu-item" data-type="routines">
                    <span class="fab-menu-icon">👥</span>
                    <span class="fab-menu-label">Routines</span>
                </button>
                <button class="fab-menu-item" data-type="shop">
                    <span class="fab-menu-icon">🛒</span>
                    <span class="fab-menu-label">Shop</span>
                </button>
                <button class="fab-menu-item" data-type="stats">
                    <span class="fab-menu-icon">📊</span>
                    <span class="fab-menu-label">Stats</span>
                </button>
                <button class="fab-menu-item" data-type="settings">
                    <span class="fab-menu-icon">⚙️</span>
                    <span class="fab-menu-label">Settings</span>
                </button>
            </div>
        </div>

        <!-- Management Windows -->
        <!-- role/aria-labelledby/tabindex on every .management-window +
             aria-label on close buttons: [P2-UI-011] Stage 1, session 61.
             tabindex="-1" lets ManagementWindows.openManagementWindow move
             keyboard focus into the window on open. -->
        <div id="tasksWindow" class="management-window hidden" role="dialog" aria-labelledby="tasksWindowTitle" tabindex="-1">
            <div class="window-header">
                <h3 id="tasksWindowTitle">Tasks</h3>
                <button class="close-window" data-window="tasksWindow" aria-label="Close Tasks window">×</button>
            </div>
            <div class="window-content">
                <button id="addNewTaskButton" class="primary-button window-add-button">+ Add New Task</button>
                <div class="window-list">
                    <h4>Active Tasks</h4>
                    <ul id="tasksWindowList" class="window-items-list">
                        <!-- Tasks will be populated by JavaScript -->
                    </ul>
                </div>
            </div>
        </div>
        
        <div id="habitsWindow" class="management-window hidden" role="dialog" aria-labelledby="habitsWindowTitle" tabindex="-1">
            <div class="window-header">
                <h3 id="habitsWindowTitle">Habits</h3>
                <button class="close-window" data-window="habitsWindow" aria-label="Close Habits window">×</button>
            </div>
            <div class="window-content">
