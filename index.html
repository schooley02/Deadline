<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline - Productivity Tower Defense</title>
    <meta name="description" content="Transform your tasks into a tower defense game. Defeat zombie enemies to complete tasks and protect your base!">
    <!-- PWA installable shell (2026-07-20, MOBILE_PWA_PLAN.md sub-session 3) —
         manifest + theme-color + icons. See sw.js's header for cache scope
         (app shell only, no game-state caching — that's localStorage's job). -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A5F55">
    <link rel="icon" href="Assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="Assets/icons/icon-192.png">
    <!-- style.css split by component 2026-07-18 (Milestone 2) — order matters:
         responsive.css MUST load last, it overrides base rules from every
         file above it at equal specificity (see css/responsive.css header
         + docs/DECISIONS.md). -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/gameCanvas.css">
    <link rel="stylesheet" href="css/enemySprites.css">
    <link rel="stylesheet" href="css/enemyStatus.css">
    <link rel="stylesheet" href="css/agendaList.css">
    <link rel="stylesheet" href="css/fabMenu.css">
    <link rel="stylesheet" href="css/managementWindows.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/routineViews.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/popups.css">
    <link rel="stylesheet" href="css/checkIn.css">
    <link rel="stylesheet" href="css/frozenNotice.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="stylesheet" href="css/stats.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/gameOverReview.css">
    <link rel="stylesheet" href="css/heroes.css">
    <link rel="stylesheet" href="css/timeSlider.css">
    <link rel="stylesheet" href="css/dayPager.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <!-- Top 60% - Game Canvas Section -->
        <div class="game-canvas">
            <!-- Player Stats Dashboard - Always visible -->
            <div class="stats-overlay">
                <div class="resource-panel">
                    <div class="stat-item">
                        <span class="stat-label">Health:</span>
                        <span id="baseHealthDisplay">100</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">XP:</span>
                        <span id="playerXpDisplay">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Level:</span>
                        <span id="playerLevelDisplay">1</span>
                    </div>
                    <div class="stat-item" id="playerPointsStat">
                        <span class="stat-label">Points:</span>
                        <span id="playerPointsDisplay">0</span>
                        <span id="playerPointsNudge" class="points-nudge hidden"></span>
                    </div>
                </div>
                
            </div>
            
            <!-- Game Canvas with Church Base -->
            <div id="gameCanvas">
                <div id="base"></div>
                <!-- Hero chips ([P1-UI-006] sub-session 3, 2026-07-19) — one
                     per routine, rendered by js/ui/heroes.js. Positioned over
                     the base zone via css/heroes.css. -->
                <div id="heroBaseZone"></div>
                <div id="midnightLine" style="display: none;"></div>
            </div>
            
            <!-- Level Up and Game Over Messages -->
            <div id="levelUpMessage" class="hidden message-overlay">LEVEL UP!</div>
            <div id="gameOverMessage" class="hidden message-overlay">GAME OVER!</div>
        </div>

        <!-- Week Strip (Week scope sub-session 4, phase 2, 2026-07-20 — see
             docs/TIME_SLIDER_WEEK_PLAN.md). 7-day "shape of my week" overview
             above the pager; tap a cell to jump the pager there. Built
             entirely in JS (js/ui/dayPagerView.js's renderWeekStrip). -->
        <div id="weekStripRow" class="week-strip-row"></div>

        <!-- Day Pager (Week scope sub-session 2, 2026-07-20 — see
             docs/TIME_SLIDER_WEEK_PLAN.md). offset -1..+6; yesterday's the
             static snapshot (sub-session 3). js/ui/dayPagerView.js. -->
        <div class="day-pager-row">
            <button id="dayPagerPrev" class="day-pager-btn" aria-label="Previous day">‹</button>
            <!-- role=status + aria-live so pressing the ‹ › buttons announces the
                 newly-viewed day to screen readers (MOBILE_PWA_PLAN.md sub-session 2) —
                 the label text is swapped silently by dayPagerView.js otherwise. -->
            <span id="dayPagerLabel" class="day-pager-label" role="status" aria-live="polite" aria-atomic="true">Today</span>
            <button id="dayPagerNext" class="day-pager-btn" aria-label="Next day">›</button>
        </div>

        <!-- Time Slider (Milestone 4, 2026-07-20) — sits ON the canvas/list
             seam per docs/UI_UX.md. Today scope only; Week/Month scope toggle
             is a later sub-item. Drag/scrub previews enemy positions at that
             time (js/ui/timeSliderView.js); releasing snaps back to now. -->
        <div class="time-slider-seam">
            <div id="timeSliderLabel" class="time-slider-label">12:00 AM</div>
            <input type="range" id="timeSlider" class="time-slider" aria-label="Preview time of day">
        </div>

        <!-- Bottom 40% - Task List Section -->
        <div class="task-section">
            <div class="task-header">
                <h2 id="taskSectionTitle">Today's Deadlines</h2>
                <div class="task-count">
                    <span id="taskCountDisplay">0 tasks</span>
                </div>
            </div>
            
            <!-- Scrollable Task List -->
            <div class="task-list-container">
                <ul id="activeItemsList" class="task-list">
                    <!-- Tasks will be populated by JavaScript -->
                </ul>
                
                <!-- Completed Tasks Section -->
                <div id="completedTasksSection" class="completed-tasks-section hidden ">
                    <h3>Completed Today</h3>
                    <ul id="completedItemsList" class="completed-tasks-list">
                        <!-- Completed tasks will be populated by JavaScript -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- Floating Action Button -->
        <div class="fab-container">
            <button id="fabButton" class="fab" title="Add new item">
                <span class="fab-icon">+</span>
            </button>
            
            <!-- Quick Action Menu -->
            <div id="fabMenu" class="fab-menu hidden">
                <button class="fab-menu-item" data-type="tasks">
                    <span class="fab-menu-icon">📋</span>
                    <span class="fab-menu-label">Tasks</span>
                </button>
                <button class="fab-menu-item" data-type="habits">
                    <span class="fab-menu-icon">⚡</span>
                    <span class="fab-menu-label">Habits</span>
                </button>
                <button class="fab-menu-item" data-type="routines">
                    <span class="fab-menu-icon">👥</span>
                    <span class="fab-menu-label">Routines</span>
                </button>
                <button class="fab-menu-item" data-type="shop">
                    <span class="fab-menu-icon">🛒</span>
                    <span class="fab-menu-label">Shop</span>
                </button>
                <button class="fab-menu-item" data-type="stats">
                    <span class="fab-menu-icon">📊</span>
                    <span class="fab-menu-label">Stats</span>
                </button>
                <button class="fab-menu-item" data-type="settings">
                    <span class="fab-menu-icon">⚙️</span>
                    <span class="fab-menu-label">Settings</span>
                </button>
            </div>
        </div>

        <!-- Management Windows -->
        <!-- role/aria-labelledby/tabindex on every .management-window +
             aria-label on close buttons: [P2-UI-011] Stage 1, session 61.
             tabindex="-1" lets ManagementWindows.openManagementWindow move
             keyboard focus into the window on open. -->
        <div id="tasksWindow" class="management-window hidden" role="dialog" aria-labelledby="tasksWindowTitle" tabindex="-1">
            <div class="window-header">
                <h3 id="tasksWindowTitle">Tasks</h3>
                <button class="close-window" data-window="tasksWindow" aria-label="Close Tasks window">×</button>
            </div>
            <div class="window-content">
                <button id="addNewTaskButton" class="primary-button window-add-button">+ Add New Task</button>
                <div class="window-list">
                    <h4>Active Tasks</h4>
                    <ul id="tasksWindowList" class="window-items-list">
                        <!-- Tasks will be populated by JavaScript -->
                    </ul>
                </div>
            </div>
        </div>
        
        <div id="habitsWindow" class="management-window hidden" role="dialog" aria-labelledby="habitsWindowTitle" tabindex="-1">
            <div class="window-header">
                <h3 id="habitsWindowTitle">Habits</h3>
                <button class="close-window" data-window="habitsWindow" aria-label="Close Habits window">×</button>
            </div>
            <div class="window-content">
                <button id="addNewHabitButton" class="primary-button window-add-button">+ Add New Habit</button>
                <div class="window-list">
                    <h4>Active Habits</h4>
                    <ul id="habitsWindowList" class="window-items-list">
                        <!-- Habits will be populated by JavaScript -->
                    </ul>
                </div>
            </div>
        </div>
        
        <div id="routinesWindow" class="management-window hidden" role="dialog" aria-labelledby="routinesWindowTitle" tabindex="-1">
            <div class="window-header">
                <h3 id="routinesWindowTitle">Routines</h3>
                <button class="close-window" data-window="routinesWindow" aria-label="Close Routines window">×</button>
            </div>
            <div class="window-content">
                <button id="addNewRoutineButton" class="primary-button window-add-button">+ Add New Routine</button>
                <div class="window-list">
                    <h4>Your Routines: (<span id="windowActiveRoutineCountDisplay">0</span>/<span id="windowTotalRoutineSlotsDisplay">1</span> Active)</h4>
                    <ul id="routinesWindowList" class="window-items-list">
                        <!-- Routines will be populated by JavaScript -->
                    </ul>
                </div>
            </div>
        </div>

        <div id="shopWindow" class="management-window hidden" role="dialog" aria-labelledby="shopWindowTitle" tabindex="-1">
            <div class="window-header">
                <h3 id="shopWindowTitle">Shop</h3>
                <button class="close-window" data-window="shopWindow" aria-label="Close Shop window">×</button>
            </div>
            <div class="window-content">
                <!-- [P1-UI-008] SHOP_PLAN.md session 2: catalog grid only.
                     Repair-kit USE (session 3) and pushback targeting
                     (session 4) come later — buying only fills inventory today. -->
                <div id="shopMessage" class="shop-message hidden"></div>
                <div id="shopWindowList" class="shop-grid">
                    <!-- Catalog cards populated by js/ui/shopView.js -->
                </div>
            </div>
        </div>

        <div id="statsWindow" class="management-window hidden" role="dialog" aria-labelledby="statsWindowTitle" tabindex="-1">
            <div class="window-header">
                <h3 id="statsWindowTitle">Stats</h3>
                <button class="close-window" data-window="statsWindow" aria-label="Close Stats window">×</button>
            </div>
            <div class="window-content">
                <!-- RUN_HISTORY_PLAN.md sub-session 3: live current-run panel
                     on top, past-run cards below. Populated by
                     js/ui/statsView.js -->
                <div id="statsCurrentPanel">
                    <!-- Live current-run panel populated by js/ui/statsView.js -->
                </div>
                <h4 class="stats-history-heading">Past Runs</h4>
                <ul id="statsHistoryList" class="stats-history-list">
                    <!-- Past-run cards populated by js/ui/statsView.js -->
                </ul>
                <!-- RUN_HISTORY_PLAN.md sub-session 4: per-routine rollup
                     across runs (the A/B comparison surface). -->
                <h4 class="stats-history-heading">Routine Performance</h4>
                <div id="statsRoutineRollup">
                    <!-- Routine rollup cards populated by js/ui/statsView.js -->
                </div>
                <!-- ACHIEVEMENTS_PLAN.md sub-session 3: lifetime badge grid
                     (locked cards w/ progress, unlocked w/ dates). Populated
                     by js/ui/statsView.js -->
                <h4 class="stats-history-heading">Achievements</h4>
                <div id="statsAchievements">
                    <!-- Badge grid populated by js/ui/statsView.js -->
                </div>
            </div>
        </div>

        <div id="settingsWindow" class="management-window hidden" role="dialog" aria-labelledby="settingsWindowTitle" tabindex="-1">
            <div class="window-header">
                <h3 id="settingsWindowTitle">Settings</h3>
                <button class="close-window" data-window="settingsWindow" aria-label="Close Settings window">×</button>
            </div>
            <div class="window-content">
                <!-- [P2-UI-009] session 59: first entry in what's meant to grow
                     into a general settings surface (docs/DATA_SCHEMA.md's
                     long-forward-declared `deadline.settings` key). Populated
                     by js/ui/settingsView.js. -->
                <div id="settingsWindowContent">
                    <!-- Effects-intensity control populated by js/ui/settingsView.js -->
                </div>
            </div>
        </div>

        <!-- Hidden Forms (for modal use) -->
        <!-- Task Form and Habit Form removed 2026-07-18 (dead legacy inline
             forms, unreachable since the showForm shadowing bug predating this
             fix — see docs/DECISIONS.md). The live creation path is the FAB
             modal system (showFormModal / createTaskFormHtml / createHabitFormHtml),
             which builds its own markup with modalTaskName/modalHabitName ids. -->
        <div class="hidden-forms" style="display: none;">
            <!-- Routine Creation Form — deliberately left in place, along with
                 script.js's routineNameInput/createRoutineButton/createRoutineDefinition(),
                 which are equally unreachable today. Session 4 of
                 docs/UI_EXTRACTION_PLAN.md reconciles this against the modal's
                 own inline routine-creation duplicate; removing it here would
                 split that story across two sessions. -->
            <div id="routineForm" class="form-container">
                <h3>Create New Routine</h3>
                <div class="form-row">
                    <label for="routineName">Routine Name:</label>
                    <input type="text" id="routineName" placeholder="e.g., Morning Ritual" required>
                </div>
                <div class="modal-buttons">
                    <button id="createRoutineButton" class="primary-button">Create Routine</button>
                    <button class="secondary-button" onclick="closeModal()">Cancel</button>
                </div>
            </div>
        </div>
        
        <!-- Restart Button -->
        <button id="restartButton" class="restart-button hidden">Start New Base (Restart)</button>
    </div>

    <script src="js/config.js"></script>
    <script src="js/settings.js"></script>
    <!-- js/runStats.js has ZERO module dependencies (pure data functions,
         no bare-global refs at load time) — loaded here, right after
         config.js, so js/damage.js (below) can call it directly at
         gameOver() time without a forward-reference problem (session 53). -->
    <script src="js/runStats.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/dayRollover.js"></script>
    <script src="js/persistence.js"></script>
    <!-- js/exportImport.js only needs Persistence.SCHEMA_VERSION as a bare
         global (same pattern as shop.js -> Economy) — loaded right after it. -->
    <script src="js/exportImport.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/movement.js"></script>
    <script src="js/timeSlider.js"></script>
    <script src="js/spawning.js"></script>
    <script src="js/damage.js"></script>
    <script src="js/progression.js"></script>
    <script src="js/heroes.js"></script>
    <script src="js/economy.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/frozenSlots.js"></script>
    <script src="js/habits.js"></script>
    <script src="js/routines.js"></script>
    <!-- js/dayPager.js needs Habits/Routines/TimeSlider all loaded first
         (see its header — pure ghost conjuring built on top of their
         existing spawn-selection + day-bounds functions). -->
    <script src="js/dayPager.js"></script>
    <script src="js/items.js"></script>
    <script src="js/state.js"></script>
    <script src="js/loop.js"></script>
    <script src="js/ui/modal.js"></script>
    <script src="js/ui/hud.js"></script>
    <script src="js/ui/fabMenu.js"></script>
    <script src="js/ui/managementWindows.js"></script>
    <script src="js/ui/shopView.js"></script>
    <script src="js/ui/statsView.js"></script>
    <script src="js/ui/settingsView.js"></script>
    <script src="js/ui/gameOverView.js"></script>
    <script src="js/ui/forms.js"></script>
    <script src="js/ui/popups.js"></script>
    <script src="js/ui/checkIn.js"></script>
    <script src="js/ui/frozenNotice.js"></script>
    <script src="js/ui/agendaList.js"></script>
    <script src="js/ui/routineViews.js"></script>
    <script src="js/ui/heroes.js"></script>
    <script src="js/ui/timeSliderView.js"></script>
    <!-- js/ui/dayPagerView.js needs DayPager (pure ghost conjuring) + Movement
         (top-position math) already loaded — see its header. -->
    <script src="js/ui/dayPagerView.js"></script>
    <script src="js/IdCounter.js"></script>
    <script src="js/TaskManager.js"></script>
    <script src="script.js"></script>
    <!-- PWA installable shell (2026-07-20, MOBILE_PWA_PLAN.md sub-session 3):
         register sw.js after everything else loads. Feature-detected +
         wrapped so a browser without SW support (or a dev environment that
         blocks it) degrades to the plain, always-worked online experience —
         nothing here is load-bearing for the game itself. -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.warn('Service worker registration failed (app still works online):', err);
                });
            });
        }
    </script>
</body>
</html>
