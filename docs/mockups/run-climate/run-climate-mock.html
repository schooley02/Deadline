<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family:'Press Start 2P'; src:url("../../../Assets/fonts/press-start-2p-latin-400-normal.woff2") format("woff2"); }
body { margin:0; background:#0e0e18; font-family: Inter, Arial, sans-serif; color:#ddd; padding:16px; }
h2 { font-size:14px; margin:18px 0 6px; font-weight:600; color:#e8e4ff; }
h2 small { color:#9a96b8; font-weight:400; margin-left:8px; }
.canvas { position:relative; width:844px; height:300px; overflow:hidden; border-radius:4px; }
.layer { position:absolute; inset:0; pointer-events:none; }
.sky { background: linear-gradient(180deg, var(--s0) 0%, var(--s1) 35%, var(--s2) 68%, var(--s3) 100%); }
.stars span { position:absolute; width:2px; height:2px; background:#f6f0d4; opacity:var(--star,0.85); }
.stars span.l { box-shadow:-2px 0 0 #fffdf2,2px 0 0 #fffdf2,0 -2px 0 #fffdf2,0 2px 0 #fffdf2; background:#fffdf2; }
.moon-wrap { position:absolute; top:8%; right:32px; width:58px; height:58px; pointer-events:none; }
.moon { width:58px; height:58px; border-radius:50%; background:url("../../../Assets/scene/moon.png") center/58px 58px no-repeat; image-rendering:pixelated;
  opacity:var(--moon,1); box-shadow: 0 0 var(--g1,36px) var(--g2,14px) rgba(253,251,232,var(--ga,0.5)), 0 0 80px 28px rgba(253,251,232,var(--gb,0.15)); }
.clouds { background-image:url("../../../Assets/scene/clouds-tile.png"); background-repeat:repeat-x; image-rendering:pixelated; }
.hill { position:absolute; left:0; right:0; bottom:0; height:160px; pointer-events:none; }
.ground { position:absolute; left:0; right:0; bottom:0; height:72px; background:url("../../../Assets/scene/floor-tile.png") repeat-x 0 100%/127px 72px; image-rendering:pixelated; pointer-events:none; }
.bld { position:absolute; image-rendering:pixelated; cursor:pointer; }
.bld.back { filter:brightness(.8); } .bld.far { filter:brightness(.65); }
.zom { position:absolute; width:128px; height:128px; image-rendering:pixelated; cursor:pointer; }
.church { position:absolute; left:0; bottom:0; width:160px; height:400px; background:url("../../../Assets/Base/base_100.png") left bottom -6px/160px 400px no-repeat; image-rendering:pixelated; }
.ui-night { position:absolute; top:8%; right:32px; width:58px; display:flex; flex-direction:column; align-items:center; z-index:40; pointer-events:none; }
.ui-night .num-box { width:58px; height:58px; display:grid; place-items:center; }
.num { font-family:'Press Start 2P', monospace; font-size:24px; line-height:1; }
.label { margin-top:10px; white-space:nowrap; font-weight:700; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:#f6f0d4; }
.inkA .num { color:#2b2a4a; text-shadow:0 0 3px rgba(255,253,242,.9), 0 0 6px rgba(255,253,242,.7); }
.inkA .label { text-shadow:0 1px 2px #0b0b24, 0 0 4px #0b0b24; }
.inkB .num { color:#fff6d8; text-shadow:2px 0 0 #0b0b24,-2px 0 0 #0b0b24,0 2px 0 #0b0b24,0 -2px 0 #0b0b24,2px 2px 0 #0b0b24,-2px -2px 0 #0b0b24,2px -2px 0 #0b0b24,-2px 2px 0 #0b0b24, 0 0 8px rgba(255,236,170,.55); }
.inkB .label { color:#fff6d8; text-shadow:1px 0 0 #0b0b24,-1px 0 0 #0b0b24,0 1px 0 #0b0b24,0 -1px 0 #0b0b24,1px 1px 0 #0b0b24,-1px -1px 0 #0b0b24; }
.plate .label { background:rgba(11,11,36,.6); padding:3px 5px; margin-top:8px; }
.badge { position:absolute; top:8px; left:176px; width:44px; height:44px; display:grid; place-items:center; z-index:40; }
.badge .chip { width:34px; height:34px; border-radius:6px; background:rgba(11,11,36,.55); box-shadow:inset 0 0 0 2px rgba(246,240,212,.35); display:grid; place-items:center; }
.badge svg { width:26px; height:26px; shape-rendering:crispEdges; }
.trend { position:absolute; right:-2px; bottom:0px; font: 700 11px Inter, Arial; color:#bfe8a8; text-shadow:0 1px 0 #0b0b24,0 0 3px #0b0b24; }
.rain { background-image: repeating-linear-gradient(105deg, transparent 0 9px, rgba(190,205,215,var(--ra,.22)) 9px 10px, transparent 10px 23px), repeating-linear-gradient(0deg, transparent 0 14px, rgba(0,0,0,0) 14px 30px);
  -webkit-mask-image: repeating-linear-gradient(0deg, #000 0 18px, transparent 18px 30px); mask-image: repeating-linear-gradient(0deg, #000 0 18px, transparent 18px 30px); mask-size:100% 30px; }
.note { font-size:12px; color:#a9a5c4; margin:6px 0 0; max-width:844px; line-height:1.45; }
.depth { position:absolute; right:6px; bottom:4px; font:600 10px Inter, Arial; color:rgba(255,255,255,.55); z-index:50; text-shadow:0 1px 2px #000; }
@keyframes drift { from { background-position-x: var(--x0); } to { background-position-x: calc(var(--x0) + var(--tw)); } }
.mv { animation: drift var(--dur) linear infinite; }
.rain { animation: rainfall var(--rd) linear infinite; }
@keyframes rainfall { from { background-position: 0 0; } to { background-position: calc(var(--rx) * -1) var(--ry); } }
</style></head><body>
<div id="out"></div>
<script>
const ICONS = {
 clear:["......cc.....","....cccc...c.","...ccc......","..ccc.....c..","..ccc........","..ccc...c....","..cccc.......","...ccccc..c..","....ccccc....","......cc.....",".c...........","......c......","............."],
 hazy:[".....cc......","...cccc......","..ccc........","..ccc........","..ccc..ggg...","..ccc.ggggg..","...cgggggggg.","....ggggggggg",".....ggggggg.","............","..............","............","............"],
 overcast:[".............","....ggg......","...ggggg.....","..gggggggg...",".ggggggggggg.","ggggggggggggg","..ddddd......",".ddddddddd...","ddddddddddddd","ddddddddddddd",".............",".............","............."],
 fog:[".............",".............","ggggggggg....",".............","...gggggggggg",".............","gggggggggg...",".............","..ggggggggggg",".............","gggggggg.....",".............","............."],
 storm:["....ddddd....","..ddddddddd..",".ddddddddddd.","ddddddddddddd","ddddddddddddd",".dddddyyddd..","......yy.....",".b...yy...b..","....yyyyy....","..b...yy...b.","......y......","....b....b...","............."],
};
const COL={c:'#f6f0d4',g:'#a8a6bf',d:'#6e6c86',y:'#f2d36b',b:'#8fb4cf'};
function icon(name){ const g=ICONS[name]; let r=''; g.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(COL[ch]) r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${COL[ch]}"/>`; })); return `<svg viewBox="0 0 13 13">${r}</svg>`; }
const stars=[[6,10,'s'],[14,26,'s'],[23,8,'s'],[31,31,'s'],[40,15,'s'],[49,6,'s'],[57,28,'s'],[66,12,'s'],[74,24,'s'],[79,6,'s'],[10,18,'l'],[36,23,'l'],[61,9,'l'],[69,33,'l']];
function starsHtml(op,keep){ return `<div class="layer stars" style="--star:${op}">`+stars.filter((s,i)=>i<keep).map(s=>`<span class="${s[2]=='l'?'l':''}" style="left:${s[0]}%;top:${s[1]}%"></span>`).join('')+`</div>`; }
function mv(x,scale,speed){ const tw=1250*scale; return speed?` mv" data-speed="${speed}" style="--x0:${x}px;--tw:${tw}px;--dur:${(tw/speed).toFixed(1)}s;`:`" style="`; }
function cloud(top,x,filter,op,scale,speed){ scale=scale||1; return `<div class="layer clouds${mv(x,scale,speed)}top:${top}px;height:${144*scale}px;background-size:${1250*scale}px ${144*scale}px;background-position:${x}px 0;filter:${filter};opacity:${op}"></div>`; }
// ground fog = the same pixel cloud sprites, lightened, translucent, laid along the ground
function fogBank(top,x,op,scale,tint,speed){ return `<div class="layer clouds${mv(x,scale,speed)}top:${top}px;height:${144*scale}px;background-size:${1250*scale}px ${144*scale}px;background-position:${x}px 0;filter:brightness(1.35) saturate(.35)${tint||''};opacity:${op}"></div>`; }
function veil(rgb,a){ return a?`<div class="layer" style="background:rgba(${rgb},${a})"></div>`:''; }
// village veils stop at the horizon (the front row's feet) with a short soft edge, so the near ground stays clear
function veilToHorizon(rgb,a){ return a?`<div class="layer" style="bottom:auto;height:${FEET+6}px;background:linear-gradient(180deg, rgba(${rgb},${a}) 0, rgba(${rgb},${a}) ${FEET-10}px, rgba(${rgb},0) ${FEET+6}px)"></div>`:''; }
function hill(fill){ return `<svg class="hill" viewBox="0 0 800 160" preserveAspectRatio="none"><path fill="${fill}" d="M0,160 L0,112 Q90,86 190,108 Q300,78 410,104 Q540,66 650,100 Q730,84 800,102 L800,160 Z"/></svg>`; }
const FEET=224;
function village(bd){
  // live arrangement, approx: far row = back + 30px, brightness .65, mirrored; back row = front + 30px, brightness .8.
  // A haze veil sits BETWEEN rows, so each row back gets one more layer of haze (cumulative).
  const img=(f,x,raise,h,cls,flip)=>`<img class="bld ${cls}" data-name="${f}" src="../../../Assets/Village/${f}.png" style="left:${x}px;top:${FEET-h-raise}px;width:128px;height:${h}px;${flip?'transform:scaleX(-1);':''}">`;
  const rh=bd.rowHaze||[0,0];
  return img('bestdays_t3',250,60,160,'far',1)+img('nights_t3',500,60,160,'far',1)
    +veilToHorizon(bd.rgb,rh[0])
    +img('heroes_t3',460,30,128,'back')+img('slain_t3',640,30,128,'back')
    +veilToHorizon(bd.rgb,rh[1])
    +(bd.fogRow||[]).map(f=>fogBank(...f)).join('')
    +img('lurkers_t3',240,0,128,'front')+img('punctuality_t3',390,0,256,'front')+img('defense_t3',560,0,128,'front');
}
function zombies(){
  return [['health-zombie',230,286],['career-zombie',420,262],['other-zombie',600,296]].map(([f,x,feet])=>`<img class="zom" data-name="${f}" src="../../../Assets/Zombies/${f}.png" style="left:${x}px;top:${feet-126}px">`).join('');
}
// depth model: farA = sky+hills only, mid = in front of village (behind zombies), near = in front of everything
const BANDS=[
 {key:'clear',title:'Clear',sub:'no haze, no fog; full moon, all stars, fireflies',
  sky:['#0b0b24','#171735','#2b2a4a','#3d3a5c'], stars:[0.9,14], moon:{op:1,g1:'36px',g2:'14px',ga:.5,gb:.15},
  clouds:[[18,-240,'none',1]], rgb:'170,168,190', far:0, mid:0, near:0, fogBack:null, fogFront:null, hill:'#141426', ink:'inkA', fireflies:true},
 {key:'hazy',title:'Hazy (a new run starts here)',sub:'light haze, strongest far away; no ground clouds',
  sky:['#11112a','#1c1c3a','#302f4c','#423f5c'], stars:[0.6,9], moon:{op:.9,g1:'26px',g2:'8px',ga:.38,gb:.10},
  clouds:[[18,-240,'none',1],[70,-760,'brightness(.85)',.85]], rgb:'170,168,190', far:.13, rowHaze:[.05,.04], mid:.06, near:.04,
  fogBack:null, fogFront:null, hill:'#15152a', ink:'inkA'},
 {key:'overcast',title:'Overcast',sub:'more, darker clouds, top of the sky only; haze a step stronger',
  sky:['#17172a','#23223a','#34324a','#46435a'], stars:[0.4,4], moon:{op:.6,g1:'16px',g2:'4px',ga:.25,gb:.05},
  clouds:[[-6,-640,'brightness(.72) saturate(.7)',1],[22,-120,'brightness(.78) saturate(.7)',1],[40,-900,'brightness(.66) saturate(.6)',.9,.75]],
  rgb:'170,168,190', far:.19, rowHaze:[.07,.05], mid:.08, near:.06, fogBack:null, fogFront:null, hill:'#17172b', ink:'inkB'},
 {key:'fog',title:'Fog',sub:'only band with ground clouds: sky 10-12, between village rows 16, in front of the village 22, in front of zombies + church 34 px/s',
  sky:['#1f1f2e','#2c2b3c','#3b3a4a','#4b4957'], stars:[0,0], moon:{op:.28,g1:'10px',g2:'2px',ga:.15,gb:0},
  clouds:[[-14,-560,'brightness(.62) saturate(.5)',1,1,12],[30,-80,'brightness(.68) saturate(.5)',1,1,12],[60,-940,'brightness(.6) saturate(.45)',.85,.8,10]],
  rgb:'175,175,190', far:.30, rowHaze:[.30,.24], mid:.16, near:.08,
  fogRow:[[104,-300,.46,.95,'',16]],
  fogMid:[[112,-420,.50,1.15,'',22],[146,-1010,.42,1,'',22]],
  fogNear:[[200,-860,.36,1.1,'',34],[236,-230,.34,1,'',34],[250,-640,.28,.9,'',34]], hill:'#1d1d2c', ink:'inkB plate'},
 {key:'storm',title:'Storm',sub:'thick slow cloud ceiling (~6 px/s), heavy rain at three depths, heavy green-grey haze; no ground clouds',
  sky:['#0f1418','#182024','#232d2e','#323b39'], stars:[0,0], moon:{op:.08,g1:'6px',g2:'1px',ga:.08,gb:0},
  clouds:[[-40,-400,'brightness(.66) saturate(.4) hue-rotate(40deg)',1,1,6],[-20,-1000,'brightness(.72) saturate(.4) hue-rotate(40deg)',1,1,6],[0,-160,'brightness(.62) saturate(.35) hue-rotate(40deg)',1,1,6],[16,-700,'brightness(.68) saturate(.35) hue-rotate(40deg)',1,.8,6],[-50,-1180,'brightness(.60) saturate(.35) hue-rotate(40deg)',1,1.2,6]],
  rgb:'70,88,86', far:.42, rowHaze:[.30,.24], mid:.18, near:.12, fogBack:null, fogFront:null, hill:'#141a1c', ink:'inkB plate', rain:true},
];
function scene(b,i){
  let h=`<div class="canvas" id="c${i}" style="--s0:${b.sky[0]};--s1:${b.sky[1]};--s2:${b.sky[2]};--s3:${b.sky[3]}">`;
  h+=`<div class="layer sky"></div>`+starsHtml(b.stars[0],b.stars[1]);
  h+=`<div class="moon-wrap"><div class="moon" style="--moon:${b.moon.op};--g1:${b.moon.g1};--g2:${b.moon.g2};--ga:${b.moon.ga};--gb:${b.moon.gb}"></div></div>`;
  b.clouds.forEach(c=>h+=cloud(c[0],c[1],c[2],c[3],c[4],c[5]));
  h+=hill(b.hill);
  h+=veil(b.rgb,b.far);                       // far haze: sky + hills only
  if(b.rain) h+=`<div class="layer rain" style="--ra:.20;--rd:1.1s;--rx:16px;--ry:60px;mask-size:100% 30px"></div>`;
  h+=`<div class="ground"></div>`;
  h+=village(b);
  h+=veilToHorizon(b.rgb,b.mid);               // mid haze: in front of the village, stops at the horizon
  (b.fogMid||[]).forEach(f=>h+=fogBank(...f));
  if(b.rain) h+=`<div class="layer rain" style="--ra:.16;--rd:.9s;--rx:20px;--ry:75px"></div>`;
  h+=`<div class="church"></div>`+zombies();
  (b.fogNear||[]).forEach(f=>h+=fogBank(...f));
  if(b.rain) h+=`<div class="layer rain" style="--ra:.22;--rd:.8s;--rx:24px;--ry:90px"></div><div class="layer rain" style="--ra:.30;--rd:.55s;--rx:32px;--ry:120px;background-size:37px 100%;mask-image:repeating-linear-gradient(0deg,#000 0 26px,transparent 26px 60px);-webkit-mask-image:repeating-linear-gradient(0deg,#000 0 26px,transparent 26px 60px)"></div>`;
  h+=veil(b.rgb,b.near);                      // near haze: over everything (very light)
  if(b.fireflies) [[300,215],[430,196],[560,228],[690,205],[380,240]].forEach(p=>h+=`<span style="position:absolute;left:${p[0]}px;top:${p[1]}px;width:2px;height:2px;background:#e8f59a;box-shadow:0 0 0 1px rgba(232,245,154,.35),0 0 6px 2px rgba(232,245,154,.35);pointer-events:none"></span>`);
  h+=`<div class="ui-night ${b.ink}"><div class="num-box"><span class="num">12</span></div><div class="label">Nights Survived</div></div>`;
  h+=`<div class="badge"><div class="chip">${icon(b.key)}</div></div>`;
  return h+`</div>`;
}
const ONLY=location.hash==='#fog'||location.hash==='#storm'; const ONLYI=location.hash==='#storm'?4:3; document.getElementById('out').innerHTML = ONLY? scene(BANDS[ONLYI],ONLYI) : BANDS.map((b,i)=>`<h2>${b.title}<small>${b.sub}</small></h2>`+scene(b,i)).join('')
 + `<p class="note">Mock: real art, approximate village placement (no graveyard hill). Depth: far haze covers sky + hills, mid haze adds over the village, near haze adds a light film over everything; ground fog = the pixel cloud sprites lightened and made see-through, one bank behind the zombies and one in front of their legs. In the game everything drifts the same way (the wind), nearest fastest: Fog = sky 10-12, village bank 22, front bank 34 px/s; Storm ceiling ~6 px/s. Every weather layer has pointer-events: none.</p><pre id="hits"></pre>`;
// prove taps pass through: what element is under a zombie / building centre in the Fog panel?
if(!ONLY){} const c=document.getElementById('c3').getBoundingClientRect(); const pts={zombie_health:[230+64,286-60],zombie_career:[420+64,262-60],clock_tower:[390+64,FEET-120],church_door:[90,250]};
window.HITS=Object.entries(pts).map(([k,[x,y]])=>{ const el=document.elementFromPoint(c.left+x,c.top+y); return k+' -> '+(el.dataset.name||el.className); });
</script></body></html>
